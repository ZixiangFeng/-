<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>关系修复聊天机器人</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="chat-page">
    <div class="phone-device" aria-label="iPhone 风格预览">
        <main class="chat-shell" aria-label="关系修复聊天机器人">
            <header class="chat-header">
                <button class="back-button" type="button" onclick="window.location.href='/'" aria-label="返回">‹</button>
                <div class="header-title">
                    <h1>AI 助手</h1>
                    <p><span></span>在线</p>
                </div>
                <button id="finishButton" class="finish-button" type="button">结束</button>
            </header>

            <section id="chatLog" class="chat-log" aria-live="polite"></section>

            <form id="chatForm" class="chat-form">
                <input
                    id="messageInput"
                    type="text"
                    autocomplete="off"
                    placeholder="输入消息... 例如：{{ example_statement }}"
                    aria-label="请输入你的回答"
                    required
                >
                <button type="submit">发送</button>
            </form>
        </main>
        <div class="home-indicator" aria-hidden="true"></div>
    </div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
