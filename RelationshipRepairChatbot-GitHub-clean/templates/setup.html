<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>关系修复聊天机器人</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="control-page">
    <main class="control-panel">
        <p class="step-label">步骤 1 / 2</p>
        <h1>关系修复聊天机器人</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post" class="condition-form">
            <fieldset>
                <legend>关系角色</legend>
                <label><input type="radio" name="task" value="victim" required> 受伤害者任务</label>
                <label><input type="radio" name="task" value="transgressor" required> 过错方任务</label>
            </fieldset>

            <button type="submit">下一步</button>
        </form>
    </main>
</body>
</html>
