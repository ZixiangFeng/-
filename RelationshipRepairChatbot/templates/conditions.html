<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>实验条件设置</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="control-page">
    <main class="control-panel">
        <p class="step-label">步骤 2 / 2</p>
        <h1>设置实验操纵条件</h1>

        <p class="selection-summary">
            已选择角色：
            {% if task == "victim" %}
                受伤害者任务
            {% else %}
                过错方任务
            {% endif %}
        </p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post" class="condition-form">
            <fieldset>
                <legend>信息框架</legend>
                <label><input type="radio" name="frame" value="gain" required> 收益框架</label>
                <label><input type="radio" name="frame" value="loss" required> 损失框架</label>
            </fieldset>

            <fieldset>
                <legend>共情沟通</legend>
                <label><input type="radio" name="empathy" value="high" required> 高共情</label>
                <label><input type="radio" name="empathy" value="low" required> 低共情</label>
            </fieldset>

            <div class="form-actions">
                <a class="secondary-link" href="{{ url_for('index') }}">返回上一步</a>
                <button type="submit">开始对话</button>
            </div>
        </form>
    </main>
</body>
</html>
